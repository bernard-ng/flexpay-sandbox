name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    name: Prepare release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
      stable: ${{ steps.version.outputs.stable }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Prepare release version
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }} image
    needs: [checks, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ needs.prepare.outputs.image }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image and GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable }}

      - name: Combine architecture images
        id: image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/merge-images.sh

      - name: Create release and attach standalone Compose file
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        shell: bash
        run: |
          mkdir -p release

          # Each release asset defaults to the exact image published by this run.
          sed "s|ghcr.io/bernard-ng/flexpay-sandbox:latest|$IMAGE@$IMAGE_DIGEST|" \
            compose.prod.yaml > release/compose.prod.yaml

          cat > release/notes.md <<'EOF'
          Run the sandbox without cloning the source:

          1. Download the attached `compose.prod.yaml` into an empty directory.
          2. Run `docker compose -f compose.prod.yaml up -d`.
          3. Open http://localhost:8080.

          The image includes the Rust API and compiled dashboard for Linux AMD64 and ARM64.
          SQLite history is kept in a named volume.

          EOF

          printf '\nImage: `%s:%s`\nDigest: `%s`\n' \
            "$IMAGE" "$RELEASE_TAG" "$IMAGE_DIGEST" >> release/notes.md

          options=()

          if [[ "$STABLE" == false ]]; then
            options+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" release/compose.prod.yaml \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file release/notes.md --generate-notes "${options[@]}"
