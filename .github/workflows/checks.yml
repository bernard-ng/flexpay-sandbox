name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml --locked

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Audit frontend dependencies
        # Unpatched braces in shadcn's CLI; see CONTRIBUTING.md's audit exception.
        run: bun audit --cwd frontend --ignore GHSA-vfj7-8cjw-p6xm

      - name: Check frontend types
        run: bun run --cwd frontend typecheck

      - name: Test frontend
        run: bun run --cwd frontend test

      - name: Build frontend
        run: bun run --cwd frontend build

  containers:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The runner's bundled Compose rejects watch.initial_sync.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.1.4

      - name: Validate Compose configuration
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Build and start both services
        run: docker compose -f compose.dev.yaml up --build --wait --wait-timeout 120

      - name: Check frontend and proxied API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/api/simulator/settings > /dev/null

      - name: Show container logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f compose.dev.yaml down --volumes

  release-image:
    name: Packaged sandbox smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLEXPAY_IMAGE: flexpay-sandbox:smoke
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-compose-action@v2
        with:
          version: v5.1.4

      - uses: docker/setup-buildx-action@v4

      - name: Build packaged sandbox
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          load: true
          tags: flexpay-sandbox:smoke
          cache-from: type=gha,scope=sandbox-amd64
          cache-to: type=gha,mode=max,scope=sandbox-amd64

      - name: Check packaged dashboard and API
        run: bash .github/scripts/smoke-release.sh
